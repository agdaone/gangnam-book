<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강남구 도서관 책 찾기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    const GANGNAM_LIBRARIES = [
      "행복한도서관", "도곡정보문화도서관", "개포하늘꿈도서관", "대치복합문화도서관",
      "못골열린도서관", "역삼도서관", "역삼푸른솔도서관", "논현북푸른도서관",
      "청담도서관", "세곡비단길도서관", "수서명화어린이도서관", "일곡어린이도서관",
      "아곡어린이도서관", "못골한옥어린이도서관", "강남구립국제영어도서관", "밀리아재미도서관", "압구정새싹작은도서관"
    ];

    function App() {
      const [keyword, setKeyword] = useState("");
      const [statusMsg, setStatusMsg] = useState("");
      const [error, setError] = useState("");
      const barcodeFileRef = useRef(null);

      // 바코드 사진에서 번호 추출 (인앱 브라우저 호환)
      const handleBarcodeScan = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setError("");
        setStatusMsg("바코드 판독 중...");

        try {
          let detected = null;

          if ("BarcodeDetector" in window) {
            const bitmap = await createImageBitmap(file);
            const detector = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "qr_code", "upc_a"] });
            const results = await detector.detect(bitmap);
            if (results.length > 0) detected = results[0].rawValue;
          }

          if (!detected) {
            const html5QrCode = new Html5Qrcode("barcode-canvas");
            detected = await html5QrCode.scanFile(file, true);
            html5QrCode.clear();
          }

          if (detected) {
            if (navigator.vibrate) navigator.vibrate(100);
            setKeyword(detected);
            setStatusMsg(`바코드 인식 완료: ${detected}`);
          } else {
            throw new Error("바코드를 인식하지 못했습니다.");
          }
        } catch (err) {
          setError("바코드를 읽지 못했습니다. 번호가 보이도록 수평으로 다시 찍어주세요.");
          setStatusMsg("");
        }
      };

      // 강남구 17개 도서관 실시간 소장/대출 여부 통합 검색창 열기
      const searchGangnamLibrary = (queryStr) => {
        const target = (queryStr || keyword).trim();
        if (!target) {
          setError("도서명 또는 바코드 번호를 입력해주세요.");
          return;
        }
        setError("");
        const encoded = encodeURIComponent(target);
        // 강남구립도서관 공식 정규 통합검색 URL (경로 오류 없이 17개 도서관 소장 결과 즉시 표출)
        const url = `https://library.gangnam.go.kr/intro/menu/10003/program/30001/plusSearchResultList.do?searchType=SIMPLE&searchCategory=ALL&searchKey=ALL&searchKeyword=${encoded}`;
        window.open(url, "_blank");
      };

      // 네이버 도서 검색 바로가기 (바코드 번호가 무슨 책인지 확인할 때 사용)
      const searchNaverBook = () => {
        const target = keyword.trim();
        if (!target) {
          setError("도서명 또는 바코드 번호를 입력해주세요.");
          return;
        }
        window.open(`https://search.naver.com/search.naver?where=nexearch&query=${encodeURIComponent(target)}`, "_blank");
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-white shadow-md flex flex-col font-sans pb-10">
          <div id="barcode-canvas" style={{ position: "absolute", left: "-9999px" }}></div>

          {/* 헤더 */}
          <header className="bg-teal-700 text-white p-5 sticky top-0 z-10 shadow">
            <h1 className="text-lg font-bold flex items-center gap-2">
              <span>📚</span> 강남구 도서관 책 찾기
            </h1>
            <p className="text-teal-100 text-xs mt-1">책 제목이나 바코드로 17개 도서관 소장·대출 현황을 바로 확인하세요</p>
          </header>

          <main className="p-4 space-y-5">
            {/* 1. 바코드 촬영 버튼 */}
            <div className="bg-teal-50 border-2 border-dashed border-teal-300 rounded-2xl p-5 text-center space-y-3">
              <div className="text-4xl">📟</div>
              <div>
                <p className="text-sm font-semibold text-teal-900">책 뒷면 바코드 찍기</p>
                <p className="text-xs text-teal-600 mt-1">서버 대기열 없이 폰 카메라로 번호를 즉시 읽습니다</p>
              </div>

              <button
                onClick={() => barcodeFileRef.current?.click()}
                className="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3.5 rounded-xl text-sm shadow transition flex items-center justify-center gap-2"
              >
                <span>📸</span> 바코드 사진 촬영하기
              </button>

              <input
                type="file"
                accept="image/*"
                capture="environment"
                ref={barcodeFileRef}
                onChange={handleBarcodeScan}
                className="hidden"
              />

              {statusMsg && <p className="text-xs text-teal-800 font-medium">{statusMsg}</p>}
            </div>

            {/* 2. 도서명 / 바코드 번호 입력창 */}
            <div className="space-y-2">
              <label className="block text-xs font-bold text-slate-700">검색할 도서명 또는 바코드 번호</label>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={keyword}
                  onChange={(e) => setKeyword(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") searchGangnamLibrary(); }}
                  placeholder="예: 코스모스 또는 9788983711892"
                  className="flex-1 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 bg-slate-50"
                />
                {keyword && (
                  <button
                    onClick={() => { setKeyword(""); setStatusMsg(""); }}
                    className="text-slate-400 hover:text-slate-600 text-xs px-2"
                  >
                    ✕
                  </button>
                )}
              </div>
            </div>

            {error && (
              <div className="bg-red-50 text-red-600 text-xs p-3 rounded-xl border border-red-200">
                ⚠️ {error}
              </div>
            )}

            {/* 3. 검색 실행 버튼 그룹 */}
            <div className="space-y-2.5 pt-1">
              <button
                onClick={() => searchGangnamLibrary()}
                className="w-full bg-slate-900 hover:bg-black text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition flex items-center justify-center gap-2"
              >
                <span>🔍</span> 강남구 17개 도서관 실시간 대출·소장 확인
              </button>

              <button
                onClick={searchNaverBook}
                className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-1.5 border border-slate-200"
              >
                <span>📖</span> 이 바코드/책의 상세정보 확인 (네이버)
              </button>
            </div>

            {/* 4. 대상 도서관 안내 */}
            <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 text-xs text-slate-600 space-y-2">
              <div className="flex justify-between items-center border-b border-slate-200 pb-2">
                <span className="font-bold text-slate-800">조회 대상 도서관 (총 17곳)</span>
                <span className="text-teal-700 font-semibold">동시 검색</span>
              </div>
              <div className="grid grid-cols-2 gap-x-2 gap-y-1 text-[11px] text-slate-500 pt-1">
                {GANGNAM_LIBRARIES.map((name) => (
                  <div key={name} className="flex items-center gap-1">
                    <span className="text-teal-500">✔</span> {name}
                  </div>
                ))}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
