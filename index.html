<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강남구 도서관 책 찾기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const LIBRARY_DATA = [
      { id: "dogok", name: "도곡정보문화도서관", tel: "02-1644-3227", openH: 9, closeH: 22, closedDays: [1], loc: "도곡동" },
      { id: "happy", name: "행복한도서관", tel: "02-567-3833", openH: 9, closeH: 18, closedDays: [1], loc: "대치동" },
      { id: "gaepo", name: "개포하늘꿈도서관", tel: "02-573-0570", openH: 9, closeH: 20, closedDays: [2], loc: "개포동" },
      { id: "daechi", name: "대치복합문화도서관", tel: "02-565-6823", openH: 9, closeH: 18, closedDays: [2], loc: "대치동" },
      { id: "motgol", name: "못골열린도서관", tel: "02-459-5522", openH: 9, closeH: 22, closedDays: [2], loc: "자곡동" },
      { id: "yeoksam", name: "역삼도서관", tel: "02-508-5188", openH: 9, closeH: 18, closedDays: [1], loc: "역삼동" },
      { id: "yeoksam_ps", name: "역삼푸른솔도서관", tel: "02-3453-6192", openH: 9, closeH: 18, closedDays: [2], loc: "역삼동" },
      { id: "nonhyeon", name: "논현북푸른도서관", tel: "02-3444-2401", openH: 9, closeH: 18, closedDays: [2], loc: "논현동" },
      { id: "cheongdam", name: "청담도서관", tel: "02-540-7042", openH: 9, closeH: 18, closedDays: [2], loc: "청담동" },
      { id: "segok", name: "세곡비단길도서관", tel: "02-445-5623", openH: 9, closeH: 18, closedDays: [1], loc: "세곡동" },
      { id: "suseo", name: "수서명화어린이도서관", tel: "02-445-8344", openH: 9, closeH: 18, closedDays: [2], loc: "수서동" },
      { id: "ilgok", name: "일곡어린이도서관", tel: "02-3412-4033", openH: 9, closeH: 18, closedDays: [1], loc: "일원동" },
      { id: "agok", name: "아곡어린이도서관", tel: "02-569-1707", openH: 9, closeH: 18, closedDays: [2], loc: "역삼동" },
      { id: "motgol_hanok", name: "못골한옥어린이도서관", tel: "02-2226-5930", openH: 9, closeH: 18, closedDays: [1], loc: "자곡동" },
      { id: "eng", name: "강남구립국제영어도서관", tel: "02-540-1004", openH: 9, closeH: 18, closedDays: [1], loc: "압구정동" },
      { id: "milia", name: "밀리아재미도서관", tel: "02-517-5788", openH: 9, closeH: 18, closedDays: [0, 1], loc: "논현동" },
      { id: "apgu", name: "압구정새싹작은도서관", tel: "02-548-2788", openH: 9, closeH: 18, closedDays: [0, 6], loc: "압구정동" }
    ];

    const isValidISBN13 = (code) => {
      const clean = code.replace(/[^0-9]/g, "");
      if (clean.length !== 13) return false;
      if (!clean.startsWith("978") && !clean.startsWith("979")) return false;
      let sum = 0;
      for (let i = 0; i < 13; i++) {
        sum += parseInt(clean[i], 10) * (i % 2 === 0 ? 1 : 3);
      }
      return sum % 10 === 0;
    };

    function App() {
      const [apiKey, setApiKey] = useState("");
      const [showKeyInput, setShowKeyInput] = useState(false);
      const [tempKey, setTempKey] = useState("");
      
      const [inputKeyword, setInputKeyword] = useState("");
      
      // 앱을 터뜨렸던 원인: 변수명 불일치 완벽 수정
      const [confirmedBook, setConfirmedBook] = useState(null); 
      
      const [editableTitle, setEditableTitle] = useState("");
      
      const [holdingLibraries, setHoldingLibraries] = useState([]);
      const [isSearchingHoldings, setIsSearchingHoldings] = useState(false);
      const [hasSearched, setHasSearched] = useState(false);

      const [isLoading, setIsLoading] = useState(false);
      const [statusMsg, setStatusMsg] = useState("");
      const [error, setError] = useState("");

      const barcodeFileRef = useRef(null);

      useEffect(() => {
        const storedKey = localStorage.getItem("gangnam_book_api_key");
        if (storedKey) setApiKey(storedKey.trim());
      }, []);

      const saveManualKey = () => {
        if (!tempKey.trim()) return;
        localStorage.setItem("gangnam_book_api_key", tempKey.trim());
        setApiKey(tempKey.trim());
        setShowKeyInput(false);
        setError("");
        alert("API 키가 저장되었습니다.");
      };

      const getLibStatus = (lib) => {
        const now = new Date();
        const day = now.getDay();
        const hour = now.getHours();

        if (lib.closedDays.includes(day)) {
          return { text: "오늘 휴관", badge: "bg-red-50 text-red-600 border-red-200" };
        }
        if (hour < lib.openH) {
          return { text: `개관 전 (${lib.openH}시)`, badge: "bg-amber-50 text-amber-600 border-amber-200" };
        }
        if (hour >= lib.closeH) {
          return { text: "금일 마감", badge: "bg-slate-100 text-slate-500 border-slate-200" };
        }
        return { text: `운영 중 (~${lib.closeH}:00)`, badge: "bg-emerald-50 text-emerald-700 border-emerald-300 font-semibold" };
      };

      const lookupBookInfo = async (codeOrTitle) => {
        const clean = codeOrTitle.replace(/[^0-9]/g, "");
        const isIsbn = clean.length === 13;
        const currentKey = apiKey || localStorage.getItem("gangnam_book_api_key");

        if (currentKey) {
          try {
            const prompt = `도서 식별: "${codeOrTitle}". 한국 출판 도서의 제목, 저자, 출판사를 아래 JSON 형식으로만 답해.\n{"title":"도서명","author":"저자명","publisher":"출판사명"}`;
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            
            const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
              method: "POST",
              headers: { "Content-Type": "application/json", "x-goog-api-key": currentKey },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.1, maxOutputTokens: 120 } }),
              signal: controller.signal
            });
            clearTimeout(timeoutId);
            
            const data = await res.json();
            if (res.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
              const text = data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim();
              const parsed = JSON.parse(text);
              if (parsed.title) {
                return { title: parsed.title, author: parsed.author || "저자 확인 필요", publisher: parsed.publisher || "", isbn: isIsbn ? clean : "" };
              }
            }
          } catch (e) {}
        }

        try {
          const query = isIsbn ? `isbn:${clean}` : encodeURIComponent(codeOrTitle);
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1`, { signal: controller.signal });
          clearTimeout(timeoutId);
          
          const data = await res.json();
          if (data.items && data.items[0]?.volumeInfo?.title) {
            const vol = data.items[0].volumeInfo;
            return { title: vol.title, author: vol.authors ? vol.authors.join(", ") : "저자 미상", publisher: vol.publisher || "", isbn: isIsbn ? clean : "" };
          }
        } catch (e) {}

        return { title: codeOrTitle, author: "직접 입력", publisher: "", isbn: isIsbn ? clean : "" };
      };

      const handleBarcodeUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setError("");
        setIsLoading(true);
        setStatusMsg("바코드 판독 중...");
        setConfirmedBook(null);
        setHasSearched(false);

        try {
          let detectedCode = null;

          if ("BarcodeDetector" in window) {
            const bitmap = await createImageBitmap(file);
            const detector = new window.BarcodeDetector({ formats: ["ean_13"] });
            const barcodes = await detector.detect(bitmap);
            if (barcodes.length > 0) detectedCode = barcodes[0].rawValue;
          }

          if (!detectedCode) {
            const html5QrCode = new Html5Qrcode("barcode-hidden-canvas");
            detectedCode = await html5QrCode.scanFile(file, true);
            html5QrCode.clear();
          }

          if (!detectedCode) {
            throw new Error("바코드를 인식하지 못했습니다. 수평을 맞춰 선명하게 촬영해주세요.");
          }

          const clean = detectedCode.replace(/[^0-9]/g, "");
          if (!isValidISBN13(clean)) {
            throw new Error(`바코드 번호(${clean})가 일부 왜곡되었습니다. 다시 한 번 촬영해주세요.`);
          }

          if (navigator.vibrate) navigator.vibrate(100);
          setStatusMsg("도서명 확인 중...");

          const book = await lookupBookInfo(clean);
          setConfirmedBook(book); 
          setEditableTitle(book.title);
          setStatusMsg("");
        } catch (err) {
          setError(err.message || "바코드 판독 실패");
          setStatusMsg("");
        } finally {
          setIsLoading(false);
        }
      };

      const handleManualSearch = async (e) => {
        if (e) e.preventDefault();
        const target = inputKeyword.trim();
        if (!target) {
          setError("도서명이나 바코드 번호를 입력해주세요.");
          return;
        }

        setError("");
        setIsLoading(true);
        setConfirmedBook(null);
        setHasSearched(false);
        setStatusMsg("도서 확인 중...");

        const book = await lookupBookInfo(target);
        setConfirmedBook(book);
        setEditableTitle(book.title);
        setStatusMsg("");
        setIsLoading(false);
      };

      const searchHoldingLibraries = async () => {
        const finalTitle = editableTitle.trim();
        if (!finalTitle) {
          setError("검색할 책 제목을 입력해주세요.");
          return;
        }

        setIsSearchingHoldings(true);
        setStatusMsg(`17개 도서관 서버에서 《${finalTitle}》 소장 여부 스크래핑 중...`);
        setError("");
        setHasSearched(true);
        setHoldingLibraries([]);

        const targetUrl = `https://library.gangnam.go.kr/intro/menu/10003/program/30001/plusSearchResultList.do?searchType=SIMPLE&searchCategory=ALL&searchKey=ALL&searchKeyword=${encodeURIComponent(finalTitle)}`;

        try {
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 12000);
          
          const response = await fetch(proxyUrl, { signal: controller.signal });
          clearTimeout(timeoutId);
          
          const json = await response.json();
          const html = json.contents || "";

          const matchedLibs = [];

          LIBRARY_DATA.forEach((lib) => {
            if (!html.includes(lib.name)) return;

            let idx = html.indexOf(lib.name);
            let isHolding = false;
            let status = "대출가능";

            while (idx !== -1) {
              const start = Math.max(0, idx - 50);
              const end = Math.min(html.length, idx + 200);
              const snippet = html.substring(start, end);

              const indicators = ["청구기호", "등록번호", "대출가능", "대출중", "예약", "보유", "비치", "자료실", "도서상태"];
              if (indicators.some((kw) => snippet.includes(kw))) {
                isHolding = true;
                if (snippet.includes("대출중") || snippet.includes("예약") || snippet.includes("관외대출불가")) {
                  status = "대출중";
                } else if (snippet.includes("대출가능") || snippet.includes("비치")) {
                  status = "대출가능";
                }
                break;
              }
              idx = html.indexOf(lib.name, idx + 1);
            }

            if (isHolding) {
              matchedLibs.push({ ...lib, status });
            }
          });

          setHoldingLibraries(matchedLibs);
          setStatusMsg("");
        } catch (err) {
          setError("도서관 서버 접속이 지연되었습니다. 아래 결과창의 공식 확인 버튼을 누르시면 즉시 열람 가능합니다.");
          setStatusMsg("");
        } finally {
          setIsSearchingHoldings(false);
        }
      };

      const getOfficialSearchUrl = () => {
        const query = encodeURIComponent(editableTitle || inputKeyword);
        return `https://library.gangnam.go.kr/intro/menu/10003/program/30001/plusSearchResultList.do?searchType=SIMPLE&searchCategory=ALL&searchKey=ALL&searchKeyword=${query}`;
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-100 flex flex-col font-sans pb-16">
          <div id="barcode-hidden-canvas" style={{ position: "absolute", left: "-9999px", width: "300px", height: "300px" }}></div>

          <header className="bg-teal-700 text-white p-5 sticky top-0 z-20 shadow-md flex justify-between items-start">
            <div>
              <h1 className="text-lg font-bold flex items-center gap-2">
                <span>📚</span> 강남구 도서관 책 찾기
              </h1>
              <p className="text-teal-200 text-xs mt-0.5">보유하고 있는 도서관만 화면에 골라냅니다</p>
            </div>
            <button 
              onClick={() => setShowKeyInput(!showKeyInput)}
              className="text-white text-xs bg-teal-800 hover:bg-teal-900 px-2 py-1 rounded-lg border border-teal-600"
            >
              ⚙️ 설정
            </button>
          </header>

          <main className="
