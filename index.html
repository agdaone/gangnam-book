<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강남구 도서관 책 찾기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // 강남구 17개 도서관 상세 메타데이터
    const LIBRARY_DATA = [
      { id: "happy", name: "행복한도서관", tel: "02-567-3833", hours: "09:00~18:00", closed: "매주 월요일, 일요일을 제외한 법정공휴일", loc: "대치동" },
      { id: "dogok", name: "도곡정보문화도서관", tel: "02-1644-3227", hours: "09:00~22:00", closed: "매주 월요일, 일요일을 제외한 법정공휴일", loc: "도곡동" },
      { id: "daechi", name: "대치복합문화도서관", tel: "02-565-6823", hours: "09:00~18:00", closed: "매주 화요일, 일요일을 제외한 법정공휴일", loc: "대치동" },
      { id: "gaepo", name: "개포하늘꿈도서관", tel: "02-573-0570", hours: "09:00~20:00", closed: "매주 화요일, 일요일을 제외한 법정공휴일", loc: "개포동" },
      { id: "yeoksam", name: "역삼도서관", tel: "02-508-5188", hours: "09:00~18:00", closed: "매주 월요일, 일요일을 제외한 법정공휴일", loc: "역삼동" },
      { id: "yeoksam_ps", name: "역삼푸른솔도서관", tel: "02-3453-6192", hours: "09:00~18:00", closed: "매주 화요일, 일요일을 제외한 법정공휴일", loc: "역삼동" },
      { id: "nonhyeon", name: "논현북푸른도서관", tel: "02-3444-2401", hours: "09:00~18:00", closed: "매주 화요일, 일요일을 제외한 법정공휴일", loc: "논현동" },
      { id: "cheongdam", name: "청담도서관", tel: "02-540-7042", hours: "09:00~18:00", closed: "매주 화요일, 일요일을 제외한 법정공휴일", loc: "청담동" },
      { id: "motgol", name: "못골열린도서관", tel: "02-459-5522", hours: "09:00~22:00", closed: "매주 화요일, 일요일을 제외한 법정공휴일", loc: "자곡동" },
      { id: "motgol_hanok", name: "못골한옥어린이도서관", tel: "02-2226-5930", hours: "09:00~18:00", closed: "매주 월요일, 일요일을 제외한 법정공휴일", loc: "자곡동" },
      { id: "segok", name: "세곡비단길도서관", tel: "02-445-5623", hours: "09:00~18:00", closed: "매주 월요일, 일요일을 제외한 법정공휴일", loc: "세곡동" },
      { id: "suseo", name: "수서명화어린이도서관", tel: "02-445-8344", hours: "09:00~18:00", closed: "매주 화요일, 일요일을 제외한 법정공휴일", loc: "수서동" },
      { id: "ilgok", name: "일곡어린이도서관", tel: "02-3412-4033", hours: "09:00~18:00", closed: "매주 월요일, 일요일을 제외한 법정공휴일", loc: "일원동" },
      { id: "agok", name: "아곡어린이도서관", tel: "02-569-1707", hours: "09:00~18:00", closed: "매주 화요일, 일요일을 제외한 법정공휴일", loc: "역삼동" },
      { id: "apgu", name: "압구정새싹작은도서관", tel: "02-548-2788", hours: "09:00~18:00", closed: "매주 토·일요일, 법정공휴일", loc: "압구정동" },
      { id: "eng", name: "강남구립국제영어도서관", tel: "02-540-1004", hours: "09:00~18:00", closed: "매주 월요일, 일요일을 제외한 법정공휴일", loc: "압구정동" },
      { id: "milia", name: "밀리아재미도서관", tel: "02-517-5788", hours: "09:00~18:00", closed: "매주 일·월요일, 법정공휴일", loc: "논현동" }
    ];

    function App() {
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedLibs, setSelectedLibs] = useState(LIBRARY_DATA.map(l => l.name));
      const [bookInfo, setBookInfo] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [statusMessage, setStatusMessage] = useState("");
      const [error, setError] = useState("");

      const barcodeFileRef = useRef(null);

      // 도서 정보 가져오기 (구글 도서 API - 무료, 무제한, CORS 없음)
      const fetchBookDetails = async (keyword) => {
        setIsLoading(true);
        setError("");
        setStatusMessage("도서 정보 검색 중...");

        try {
          const isIsbn = /^[\d-]+$/.test(keyword.trim());
          const queryParam = isIsbn ? `isbn:${keyword.trim().replace(/-/g, '')}` : encodeURIComponent(keyword.trim());
          const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${queryParam}&maxResults=1`);
          const data = await res.json();

          if (data.items && data.items.length > 0) {
            const vol = data.items[0].volumeInfo;
            const isbn13 = vol.industryIdentifiers?.find(id => id.type === "ISBN_13")?.identifier || 
                           vol.industryIdentifiers?.[0]?.identifier || keyword;
            
            setBookInfo({
              title: vol.title || keyword,
              authors: vol.authors ? vol.authors.join(", ") : "저자 미상",
              publisher: vol.publisher || "출판사 미상",
              publishedDate: vol.publishedDate || "",
              description: vol.description ? vol.description.slice(0, 120) + "..." : "",
              thumbnail: vol.imageLinks?.thumbnail || vol.imageLinks?.smallThumbnail || null,
              isbn: isbn13
            });
            setStatusMessage("");
          } else {
            // 구글 도서에 없더라도 입력값 기준 카드 생성
            setBookInfo({
              title: keyword,
              authors: "확인 필요",
              publisher: "직접 검색",
              publishedDate: "",
              description: "세부 정보가 확인되지 않아 입력하신 명칭으로 도서관 현황을 표출합니다.",
              thumbnail: null,
              isbn: keyword
            });
            setStatusMessage("");
          }
        } catch (err) {
          setBookInfo({
            title: keyword,
            authors: "확인 필요",
            publisher: "직접 검색",
            publishedDate: "",
            description: "",
            thumbnail: null,
            isbn: keyword
          });
          setStatusMessage("");
        } finally {
          setIsLoading(false);
        }
      };

      // 바코드 사진 판독
      const handleBarcodeUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setError("");
        setIsLoading(true);
        setStatusMessage("바코드 인식 중...");

        try {
          let detectedCode = null;

          if ("BarcodeDetector" in window) {
            const imgBitmap = await createImageBitmap(file);
            const detector = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "code_128", "qr_code"] });
            const barcodes = await detector.detect(imgBitmap);
            if (barcodes.length > 0) {
              detectedCode = barcodes[0].rawValue;
            }
          }

          if (!detectedCode) {
            const html5QrCode = new Html5Qrcode("barcode-hidden-canvas");
            detectedCode = await html5QrCode.scanFile(file, true);
            html5QrCode.clear();
          }

          if (detectedCode) {
            if (navigator.vibrate) navigator.vibrate(100);
            setSearchQuery(detectedCode);
            await fetchBookDetails(detectedCode);
          } else {
            throw new Error("바코드를 인식하지 못했습니다.");
          }
        } catch (err) {
          setError("바코드를 읽지 못했습니다. 수평을 맞춰 선명하게 촬영해주세요.");
          setIsLoading(false);
          setStatusMessage("");
        }
      };

      const handleSearchSubmit = (e) => {
        if (e) e.preventDefault();
        if (!searchQuery.trim()) {
          setError("도서명 또는 바코드 번호를 입력해주세요.");
          return;
        }
        fetchBookDetails(searchQuery);
      };

      const toggleLibrary = (name) => {
        if (selectedLibs.includes(name)) setSelectedLibs(selectedLibs.filter(n => n !== name));
        else setSelectedLibs([...selectedLibs, name]);
      };

      const selectAll = () => setSelectedLibs(LIBRARY_DATA.map(l => l.name));
      const deselectAll = () => setSelectedLibs([]);

      // 도서관 정규 통합검색 안전 링크 생성 (경로 오류 방지 처리)
      const getSafeLibraryUrl = (libName, bookTitle) => {
        const query = encodeURI(bookTitle || searchQuery);
        return `https://library.gangnam.go.kr/intro/menu/10003/program/30001/plusSearchResultList.do?searchType=SIMPLE&searchCategory=ALL&searchKey=ALL&searchKeyword=${query}`;
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-100 flex flex-col font-sans pb-10">
          {/* 헤더 */}
          <header className="bg-teal-700 text-white p-5 sticky top-0 z-20 shadow-md">
            <h1 className="text-lg font-bold flex items-center gap-2">
              <span>📚</span> 강남구 도서관 통합 책 찾기
            </h1>
            <p className="text-teal-200 text-xs mt-0.5">바코드 또는 도서명으로 17개 도서관 현황을 확인하세요</p>
          </header>

          <main className="p-4 space-y-4">
            <div id="barcode-hidden-canvas" style={{ position: "absolute", left: "-9999px", width: "300px", height: "300px" }}></div>

            {/* 입력 & 바코드 촬영 바 */}
            <div className="bg-white rounded-2xl p-4 shadow-sm space-y-3">
              <form onSubmit={handleSearchSubmit} className="flex gap-2">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="도서명 또는 바코드 번호 입력"
                  className="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 bg-slate-50"
                />
                <button
                  type="submit"
                  className="bg-teal-600 hover:bg-teal-700 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shrink-0"
                >
                  검색
                </button>
              </form>

              <button
                type="button"
                onClick={() => barcodeFileRef.current?.click()}
                className="w-full bg-slate-800 hover:bg-black text-white font-medium py-3 rounded-xl text-xs shadow transition flex items-center justify-center gap-2"
              >
                <span>📷</span> 책 뒷면 바코드 촬영으로 즉시 찾기
              </button>

              <input
                type="file"
                accept="image/*"
                capture="environment"
                ref={barcodeFileRef}
                onChange={handleBarcodeUpload}
                className="hidden"
              />

              {statusMessage && (
                <div className="flex items-center justify-center gap-2 text-xs text-teal-700 font-medium py-1">
                  <div className="w-3.5 h-3.5 border-2 border-teal-600 border-t-transparent rounded-full animate-spin"></div>
                  {statusMessage}
                </div>
              )}

              {error && (
                <div className="bg-red-50 text-red-600 text-xs p-2.5 rounded-xl border border-red-200">
                  ⚠️ {error}
                </div>
              )}
            </div>

            {/* 화면 표출 1: 검색된 도서 상세 카드 */}
            {bookInfo && (
              <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3 animate-fade-in">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                  <span className="text-xs font-bold text-teal-800 bg-teal-50 px-2.5 py-1 rounded-md">선택된 도서 정보</span>
                  <span className="text-xs text-slate-400">ISBN: {bookInfo.isbn}</span>
                </div>

                <div className="flex gap-3">
                  {bookInfo.thumbnail ? (
                    <img src={bookInfo.thumbnail} alt={bookInfo.title} className="w-20 h-28 object-cover rounded-lg shadow shrink-0 border" />
                  ) : (
                    <div className="w-20 h-28 bg-slate-200 rounded-lg flex items-center justify-center text-slate-400 text-xs shrink-0">
                      이미지 없음
                    </div>
                  )}
                  <div className="flex-1 space-y-1">
                    <h2 className="text-sm font-bold text-slate-900 leading-snug">{bookInfo.title}</h2>
                    <p className="text-xs text-slate-600">저자: <span className="text-slate-800 font-medium">{bookInfo.authors}</span></p>
                    <p className="text-xs text-slate-600">출판사: <span className="text-slate-800 font-medium">{bookInfo.publisher}</span></p>
                    {bookInfo.publishedDate && (
                      <p className="text-xs text-slate-400">발행: {bookInfo.publishedDate}</p>
                    )}
                  </div>
                </div>

                {bookInfo.description && (
                  <p className="text-xs text-slate-500 bg-slate-50 p-2.5 rounded-lg leading-relaxed">
                    {bookInfo.description}
                  </p>
                )}
              </div>
            )}

            {/* 화면 표출 2: 도서관 필터 */}
            <div className="bg-white rounded-2xl p-3.5 shadow-sm space-y-2">
              <div className="flex justify-between items-center text-xs">
                <span className="font-bold text-slate-700">조회 대상 도서관 ({selectedLibs.length} / {LIBRARY_DATA.length})</span>
                <div className="space-x-2">
                  <button onClick={selectAll} className="text-teal-600 hover:underline">전체</button>
                  <span className="text-slate-300">|</span>
                  <button onClick={deselectAll} className="text-slate-400 hover:underline">해제</button>
                </div>
              </div>

              <div className="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto pt-1">
                {LIBRARY_DATA.map((lib) => {
                  const isChecked = selectedLibs.includes(lib.name);
                  return (
                    <button
                      key={lib.id}
                      onClick={() => toggleLibrary(lib.name)}
                      className={`text-xs px-2.5 py-1 rounded-lg border transition ${
                        isChecked 
                          ? "bg-teal-50 border-teal-300 text-teal-800 font-medium" 
                          : "bg-slate-50 border-slate-200 text-slate-400"
                      }`}
                    >
                      {lib.name}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 화면 표출 3: 17개 도서관 실시간 대출·소장 현황 대시보드 리스트 */}
            <div className="space-y-2.5">
              <div className="flex items-center justify-between px-1">
                <span className="text-xs font-bold text-slate-700">도서관별 상세 현황판</span>
                <span className="text-xs text-slate-500">선택 {selectedLibs.length}곳</span>
              </div>

              {LIBRARY_DATA.filter(lib => selectedLibs.includes(lib.name)).map((lib) => (
                <div key={lib.id} className="bg-white rounded-xl p-3.5 shadow-sm border border-slate-200 space-y-2.5">
                  <div className="flex justify-between items-start">
                    <div>
                      <div className="flex items-center gap-1.5">
                        <span className="text-sm font-bold text-slate-800">{lib.name}</span>
                        <span className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">{lib.loc}</span>
                      </div>
                      <p className="text-xs text-slate-500 mt-0.5">운영: {lib.hours}</p>
                    </div>

                    <a
                      href={`tel:${lib.tel}`}
                      className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1 shrink-0 font-medium"
                    >
                      <span>📞</span> 전화 문의
                    </a>
                  </div>

                  <div className="bg-slate-50 rounded-lg p-2 text-[11px] text-slate-500 flex justify-between items-center">
                    <span>휴관일: {lib.closed}</span>
                    <span className="text-slate-400">{lib.tel}</span>
                  </div>

                  {/* 안전 직통 조회 버튼 */}
                  <div className="pt-1">
                    <a
                      href={getSafeLibraryUrl(lib.name, bookInfo?.title)}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="block w-full text-center bg-teal-50 hover:bg-teal-100 border border-teal-200 text-teal-800 font-semibold py-2 rounded-lg text-xs transition"
                    >
                      🔍 {lib.name}에서 이 책 실시간 소장·대출 확인
                    </a>
                  </div>
                </div>
              ))}

              {selectedLibs.length === 0 && (
                <div className="bg-white p-6 rounded-2xl text-center text-xs text-slate-400">
                  선택된 도서관이 없습니다. 위 목록에서 도서관을 선택해주세요.
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
