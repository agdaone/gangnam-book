<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강남구 도서관 책 찾기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const LIBRARY_DATA = [
      { id: "dogok", name: "도곡정보문화도서관", tel: "02-1644-3227", openH: 9, closeH: 22, closedDays: [1], loc: "도곡동" },
      { id: "happy", name: "행복한도서관", tel: "02-567-3833", openH: 9, closeH: 18, closedDays: [1], loc: "대치동" },
      { id: "gaepo", name: "개포하늘꿈도서관", tel: "02-573-0570", openH: 9, closeH: 20, closedDays: [2], loc: "개포동" },
      { id: "daechi", name: "대치복합문화도서관", tel: "02-565-6823", openH: 9, closeH: 18, closedDays: [2], loc: "대치동" },
      { id: "motgol", name: "못골열린도서관", tel: "02-459-5522", openH: 9, closeH: 22, closedDays: [2], loc: "자곡동" },
      { id: "yeoksam", name: "역삼도서관", tel: "02-508-5188", openH: 9, closeH: 18, closedDays: [1], loc: "역삼동" },
      { id: "yeoksam_ps", name: "역삼푸른솔도서관", tel: "02-3453-6192", openH: 9, closeH: 18, closedDays: [2], loc: "역삼동" },
      { id: "nonhyeon", name: "논현북푸른도서관", tel: "02-3444-2401", openH: 9, closeH: 18, closedDays: [2], loc: "논현동" },
      { id: "cheongdam", name: "청담도서관", tel: "02-540-7042", openH: 9, closeH: 18, closedDays: [2], loc: "청담동" },
      { id: "segok", name: "세곡비단길도서관", tel: "02-445-5623", openH: 9, closeH: 18, closedDays: [1], loc: "세곡동" },
      { id: "suseo", name: "수서명화어린이도서관", tel: "02-445-8344", openH: 9, closeH: 18, closedDays: [2], loc: "수서동" },
      { id: "ilgok", name: "일곡어린이도서관", tel: "02-3412-4033", openH: 9, closeH: 18, closedDays: [1], loc: "일원동" },
      { id: "agok", name: "아곡어린이도서관", tel: "02-569-1707", openH: 9, closeH: 18, closedDays: [2], loc: "역삼동" },
      { id: "motgol_hanok", name: "못골한옥어린이도서관", tel: "02-2226-5930", openH: 9, closeH: 18, closedDays: [1], loc: "자곡동" },
      { id: "eng", name: "강남구립국제영어도서관", tel: "02-540-1004", openH: 9, closeH: 18, closedDays: [1], loc: "압구정동" },
      { id: "milia", name: "밀리아재미도서관", tel: "02-517-5788", openH: 9, closeH: 18, closedDays: [0, 1], loc: "논현동" },
      { id: "apgu", name: "압구정새싹작은도서관", tel: "02-548-2788", openH: 9, closeH: 18, closedDays: [0, 6], loc: "압구정동" }
    ];

    const isValidISBN13 = (code) => {
      const clean = code.replace(/[^0-9]/g, "");
      if (clean.length !== 13) return false;
      if (!clean.startsWith("978") && !clean.startsWith("979")) return false;
      let sum = 0;
      for (let i = 0; i < 13; i++) {
        sum += parseInt(clean[i], 10) * (i % 2 === 0 ? 1 : 3);
      }
      return sum % 10 === 0;
    };

    function App() {
      const [apiKey, setApiKey] = useState("");
      const [showKeyInput, setShowKeyInput] = useState(false);
      const [tempKey, setTempKey] = useState("");
      
      const [inputKeyword, setInputKeyword] = useState("");
      const [identifiedBook, setIdentifiedBook] = useState(null);
      const [editableTitle, setEditableTitle] = useState("");
      
      const [holdingLibraries, setHoldingLibraries] = useState([]);
      const [isSearchingHoldings, setIsSearchingHoldings] = useState(false);
      const [hasSearched, setHasSearched] = useState(false);

      // 치명적 에러 원인이었던 변수 선언 누락 복구
      const [isLoading, setIsLoading] = useState(false);
      
      const [statusMsg, setStatusMsg] = useState("");
      const [error, setError] = useState("");

      const barcodeFileRef = useRef(null);

      useEffect(() => {
        const storedKey = localStorage.getItem("gangnam_book_api_key");
        if (storedKey) setApiKey(storedKey.trim());
      }, []);

      const saveManualKey = () => {
        if (!tempKey.trim()) return;
        localStorage.setItem("gangnam_book_api_key", tempKey.trim());
        setApiKey(tempKey.trim());
        setShowKeyInput(false);
        setError("");
        alert("API 키가 저장되었습니다.");
      };

      const getLibStatus = (lib) => {
        const now = new Date();
        const day = now.getDay();
        const hour = now.getHours();

        if (lib.closedDays.includes(day)) {
          return { text: "오늘 휴관", badge: "bg-red-50 text-red-600 border-red-200" };
        }
        if (hour < lib.openH) {
          return { text: `개관 전 (${lib.openH}시)`, badge: "bg-amber-50 text-amber-600 border-amber-200" };
        }
        if (hour >= lib.closeH) {
          return { text: "금일 마감", badge: "bg-slate-100 text-slate-500 border-slate-200" };
        }
        return { text: `운영 중 (~${lib.closeH}:00)`, badge: "bg-emerald-50 text-emerald-700 border-emerald-300 font-semibold" };
      };

      const lookupBookInfo = async (codeOrTitle) => {
        const clean = codeOrTitle.replace(/[^0-9]/g, "");
        const isIsbn = clean.length === 13;
        const currentKey = apiKey || localStorage.getItem("gangnam_book_api_key");

        if (currentKey) {
          try {
            const prompt = `도서 식별: "${codeOrTitle}". 한국 출판 도서의 제목, 저자, 출판사를 아래 JSON 형식으로만 답해.\n{"title":"도서명","author":"저자명","publisher":"출판사명"}`;
            
            // 타임아웃 안전장치
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            
            const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
              method: "POST",
              headers: { "Content-Type": "application/json", "x-goog-api-key": currentKey },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.1, maxOutputTokens: 120 } }),
              signal: controller.signal
            });
            clearTimeout(timeoutId);
            
            const data = await res.json();
            if (res.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
              const text = data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim();
              const parsed = JSON.parse(text);
              if (parsed.title) {
                return { title: parsed.title, author: parsed.author || "저자 확인 필요", publisher: parsed.publisher || "", isbn: isIsbn ? clean : "" };
              }
            }
          } catch (e) {}
        }

        try {
          const query = isIsbn ? `isbn:${clean}` : encodeURIComponent(codeOrTitle);
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1`, { signal: controller.signal });
          clearTimeout(timeoutId);
          
          const data = await res.json();
          if (data.items && data.items[0]?.volumeInfo?.title) {
            const vol = data.items[0].volumeInfo;
            return { title: vol.title, author: vol.authors ? vol.authors.join(", ") : "저자 미상", publisher: vol.publisher || "", isbn: isIsbn ? clean : "" };
          }
        } catch (e) {}

        return { title: codeOrTitle, author: "직접 입력", publisher: "", isbn: isIsbn ? clean : "" };
      };

      const handleBarcodeUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setError("");
        setIsLoading(true);
        setStatusMsg("바코드 판독 중...");
        setConfirmedBook(null);
        setHasSearched(false);

        try {
          let detectedCode = null;

          if ("BarcodeDetector" in window) {
            const bitmap = await createImageBitmap(file);
            const detector = new window.BarcodeDetector({ formats: ["ean_13"] });
            const barcodes = await detector.detect(bitmap);
            if (barcodes.length > 0) detectedCode = barcodes[0].rawValue;
          }

          if (!detectedCode) {
            const html5QrCode = new Html5Qrcode("barcode-hidden-canvas");
            detectedCode = await html5QrCode.scanFile(file, true);
            html5QrCode.clear();
          }

          if (!detectedCode) {
            throw new Error("바코드를 인식하지 못했습니다. 수평을 맞춰 선명하게 촬영해주세요.");
          }

          const clean = detectedCode.replace(/[^0-9]/g, "");
          if (!isValidISBN13(clean)) {
            throw new Error(`바코드 번호(${clean})가 일부 왜곡되었습니다. 다시 한 번 촬영해주세요.`);
          }

          if (navigator.vibrate) navigator.vibrate(100);
          setStatusMsg("도서명 확인 중...");

          const book = await lookupBookInfo(clean);
          setConfirmedBook(book);
          setEditableTitle(book.title);
          setStatusMsg("");
        } catch (err) {
          setError(err.message || "바코드 판독 실패");
          setStatusMsg("");
        } finally {
          setIsLoading(false);
        }
      };

      const handleManualSearch = async (e) => {
        if (e) e.preventDefault();
        const target = inputKeyword.trim();
        if (!target) {
          setError("도서명이나 바코드 번호를 입력해주세요.");
          return;
        }

        setError("");
        setIsLoading(true);
        setConfirmedBook(null);
        setHasSearched(false);
        setStatusMsg("도서 확인 중...");

        const book = await lookupBookInfo(target);
        setConfirmedBook(book);
        setEditableTitle(book.title);
        setStatusMsg("");
        setIsLoading(false);
      };

      const searchHoldingLibraries = async () => {
        const finalTitle = editableTitle.trim();
        if (!finalTitle) {
          setError("검색할 책 제목을 입력해주세요.");
          return;
        }

        setIsSearchingHoldings(true);
        setStatusMsg(`17개 도서관 서버에서 《${finalTitle}》 소장 여부 스크래핑 중...`);
        setError("");
        setHasSearched(true);
        setHoldingLibraries([]);

        const targetUrl = `https://library.gangnam.go.kr/intro/menu/10003/program/30001/plusSearchResultList.do?searchType=SIMPLE&searchCategory=ALL&searchKey=ALL&searchKeyword=${encodeURIComponent(finalTitle)}`;

        try {
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000);
          
          const response = await fetch(proxyUrl, { signal: controller.signal });
          clearTimeout(timeoutId);
          
          const json = await response.json();
          const html = json.contents || "";

          const matchedLibs = [];

          LIBRARY_DATA.forEach((lib) => {
            if (!html.includes(lib.name)) return;

            let idx = html.indexOf(lib.name);
            let isHolding = false;
            let status = "대출가능";

            while (idx !== -1) {
              const start = Math.max(0, idx - 50);
              const end = Math.min(html.length, idx + 200);
              const snippet = html.substring(start, end);

              const indicators = ["청구기호", "등록번호", "대출가능", "대출중", "예약", "보유", "비치", "자료실", "도서상태"];
              if (indicators.some((kw) => snippet.includes(kw))) {
                isHolding = true;
                if (snippet.includes("대출중") || snippet.includes("예약") || snippet.includes("관외대출불가")) {
                  status = "대출중";
                } else if (snippet.includes("대출가능") || snippet.includes("비치")) {
                  status = "대출가능";
                }
                break;
              }
              idx = html.indexOf(lib.name, idx + 1);
            }

            if (isHolding) {
              matchedLibs.push({ ...lib, status });
            }
          });

          setHoldingLibraries(matchedLibs);
          setStatusMsg("");
        } catch (err) {
          setError("도서관 서버 접속이 지연되었습니다. 아래 결과창의 공식 확인 버튼을 누르시면 즉시 열람 가능합니다.");
          setStatusMsg("");
        } finally {
          setIsSearchingHoldings(false);
        }
      };

      const getOfficialSearchUrl = () => {
        const query = encodeURIComponent(editableTitle || inputKeyword);
        return `https://library.gangnam.go.kr/intro/menu/10003/program/30001/plusSearchResultList.do?searchType=SIMPLE&searchCategory=ALL&searchKey=ALL&searchKeyword=${query}`;
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-100 flex flex-col font-sans pb-16">
          <div id="barcode-hidden-canvas" style={{ position: "absolute", left: "-9999px" }}></div>

          <header className="bg-teal-700 text-white p-5 sticky top-0 z-20 shadow-md flex justify-between items-start">
            <div>
              <h1 className="text-lg font-bold flex items-center gap-2">
                <span>📚</span> 강남구 도서관 책 찾기
              </h1>
              <p className="text-teal-200 text-xs mt-0.5">보유하고 있는 도서관만 골라냅니다</p>
            </div>
            <button 
              onClick={() => setShowKeyInput(!showKeyInput)}
              className="text-white text-xs bg-teal-800 hover:bg-teal-900 px-2 py-1 rounded-lg border border-teal-600"
            >
              ⚙️ 설정
            </button>
          </header>

          <main className="p-4 space-y-4">
            {showKeyInput && (
              <div className="bg-teal-50 border border-teal-200 rounded-xl p-3 text-xs space-y-2">
                <p className="font-semibold text-teal-900">🔑 Gemini API 키 등록</p>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={tempKey}
                    onChange={(e) => setTempKey(e.target.value)}
                    placeholder="API 키 붙여넣기"
                    className="flex-1 border border-slate-300 rounded-lg px-2 text-xs bg-white"
                  />
                  <button onClick={saveManualKey} className="bg-teal-600 text-white font-medium px-3 py-1.5 rounded-lg text-xs">저장</button>
                </div>
              </div>
            )}

            <div className="bg-white rounded-2xl p-4 shadow-sm space-y-3">
              <button
                type="button"
                onClick={() => barcodeFileRef.current?.click()}
                className="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 rounded-xl text-sm shadow flex items-center justify-center gap-2"
              >
                <span>📸</span> 책 뒷면 바코드 찍기
              </button>

              <input
                type="file"
                accept="image/*"
                capture="environment"
                ref={barcodeFileRef}
                onChange={handleBarcodeUpload}
                className="hidden"
              />

              <div className="relative flex items-center text-xs text-slate-400 py-1">
                <div className="flex-grow border-t border-slate-200"></div>
                <span className="flex-shrink mx-2">또는 제목/번호 직접 입력</span>
                <div className="flex-grow border-t border-slate-200"></div>
              </div>

              <form onSubmit={handleManualSearch} className="flex gap-2">
                <input
                  type="text"
                  value={inputKeyword}
                  onChange={(e) => setInputKeyword(e.target.value)}
                  placeholder="예: 불편한 편의점 또는 97889..."
                  className="flex-1 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 bg-slate-50"
                />
                <button
                  type="submit"
                  className="bg-slate-800 hover:bg-black text-white font-semibold px-4 py-2.5 rounded-xl text-sm shrink-0"
                >
                  조회
                </button>
              </form>

              {statusMsg && (
                <div className="flex items-center justify-center gap-2 text-xs text-teal-800 font-medium py-1">
                  {isLoading && <div className="w-3.5 h-3.5 border-2 border-teal-600 border-t-transparent rounded-full animate-spin"></div>}
                  {statusMsg}
                </div>
              )}

              {error && (
                <div className="bg-red-50 text-red-600 text-xs p-3 rounded-xl border border-red-200">
                  ⚠️ {error}
                </div>
              )}
            </div>

            {confirmedBook && (
              <div className="bg-white rounded-2xl p-4 shadow-md border-2 border-teal-500 space-y-3 animate-fade-in">
                <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                  <span className="text-xs font-bold text-teal-800 bg-teal-50 px-2.5 py-1 rounded-md">찾으시는 책이 맞나요?</span>
                  {confirmedBook.isbn && <span className="text-[11px] text-slate-400">ISBN: {confirmedBook.isbn}</span>}
                </div>

                <div>
                  <label className="block text-[11px] font-semibold text-slate-500 mb-1">도서명 (틀릴 경우 직접 수정 가능)</label>
                  <input
                    type="text"
                    value={editableTitle}
                    onChange={(e) => setEditableTitle(e.target.value)}
                    className="w-full font-bold text-slate-900 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-teal-500 bg-slate-50"
                  />
                  <div className="flex gap-3 text-xs text-slate-600 mt-1.5">
                    {confirmedBook.author && <span>저자: <strong>{confirmedBook.author}</strong></span>}
                    {confirmedBook.publisher && <span>출판: <strong>{confirmedBook.publisher}</strong></span>}
                  </div>
                </div>

                <button
                  onClick={searchHoldingLibraries}
                  disabled={isSearchingHoldings}
                  className={`w-full font-bold py-3.5 rounded-xl text-sm shadow flex items-center justify-center gap-2 ${
                    isSearchingHoldings ? "bg-slate-400 text-white cursor-not-allowed" : "bg-emerald-600 hover:bg-emerald-700 text-white"
                  }`}
                >
                  <span>{isSearchingHoldings ? "⏳" : "🔍"}</span>
                  {isSearchingHoldings ? "도서관 서버 확인 중..." : "맞습니다, 소장 도서관 찾기"}
                </button>
              </div>
            )}

            {hasSearched && (
              <div className="space-y-3 pt-2">
                <div className="flex justify-between items-center px-1">
                  <span className="text-xs font-bold text-slate-800">
                    📖 《{editableTitle}》 소장 도서관
                  </span>
                  <span className="text-xs font-bold text-teal-700">
                    {holdingLibraries.length > 0 ? `${holdingLibraries.length}곳 보유` : "0곳"}
                  </span>
                </div>

                {holdingLibraries.length > 0 ? (
                  holdingLibraries.map((lib) => (
                    <div key={lib.id} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <div className="flex items-center gap-1.5">
                            <span className="text-sm font-bold text-slate-900">{lib.name}</span>
                            <span className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">{lib.loc}</span>
                          </div>
                          <p className="text-xs text-slate-500 mt-1">운영시간: {lib.openH}:00 ~ {lib.closeH}:00</p>
                        </div>

                        <span className={`text-xs px-2.5 py-1 rounded-full font-bold border ${
                          lib.status === "대출가능" 
                            ? "bg-emerald-50 text-emerald-700 border-emerald-300" 
                            : "bg-red-50 text-red-600 border-red-200"
                        }`}>
                          {lib.status === "대출가능" ? "🟢 대출가능" : "🔴 대출중 / 예약"}
                        </span>
                      </div>

                      <div className="flex gap-2 pt-1 border-t border-slate-100">
                        <a
                          href={getOfficialSearchUrl()}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="flex-1 bg-teal-50 hover:bg-teal-100 border border-teal-200 text-teal-800 font-semibold py-2.5 rounded-xl text-xs text-center flex items-center justify-center gap-1"
                        >
                          <span>🔍</span> 강남구 통합 전산망에서 상세보기
                        </a>
                        <a
                          href={`tel:${lib.tel}`}
                          className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3.5 py-2.5 rounded-xl text-xs flex items-center justify-center gap-1"
                        >
                          <span>📞</span>
                        </a>
                      </div>
                    </div>
                  ))
                ) : (
                  !isSearchingHoldings && (
                    <div className="bg-white rounded-2xl p-6 text-center space-y-3 border border-slate-200 shadow-sm">
                      <div className="text-3xl">🏜️</div>
                      <p className="text-sm font-bold text-slate-800">소장 중인 도서관이 없거나 모두 대출 중입니다</p>
                      <p className="text-xs text-slate-500">
                        오류가 의심되시거나 도서관 전체 검색 결과를 직접 확인하시려면 아래 공식 링크를 눌러주세요.
                      </p>
                      <a
                        href={getOfficialSearchUrl()}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-block bg-slate-900 hover:bg-black text-white text-xs font-semibold px-5 py-3 rounded-xl shadow"
                      >
                        강남구 공식 통합검색 화면 열기
                      </a>
                    </div>
                  )
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
