<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강남구 도서관 책 찾기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 바코드 라이브러리 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const GANGNAM_LIBRARIES = [
      "행복한도서관", "강남구립국제영어도서관", "개포하늘꿈도서관", "논현북푸른도서관",
      "대치복합문화도서관", "도곡정보문화도서관", "못골열린도서관", "못골한옥어린이도서관",
      "밀리아재미도서관", "세곡비단길도서관", "수서명화어린이도서관", "아곡어린이도서관",
      "압구정새싹작은도서관", "역삼도서관", "역삼푸른솔도서관", "일곡어린이도서관", "청담도서관"
    ];

    // 사진 크기를 대폭 줄여 전송 실패 방지
    const resizeImage = (file) => {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(img.src);
          const maxDim = 800;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const base64 = canvas.toDataURL("image/jpeg", 0.6).split(",")[1];
          resolve(base64);
        };
        img.onerror = () => reject(new Error("이미지 처리 실패"));
      });
    };

    function App() {
      const [apiKey, setApiKey] = useState("");
      const [showKeyInput, setShowKeyInput] = useState(false);
      const [tempKey, setTempKey] = useState("");
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedLibs, setSelectedLibs] = useState(GANGNAM_LIBRARIES);
      
      const [scanMode, setScanMode] = useState("cover");
      const [imagePreview, setImagePreview] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [statusMessage, setStatusMessage] = useState("");
      
      const [isScanningBarcode, setIsScanningBarcode] = useState(false);
      const qrScannerRef = useRef(null);

      const [error, setError] = useState("");
      const fileInputRef = useRef(null);
      const barcodeFileRef = useRef(null);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlKey = params.get("key");

        if (urlKey) {
          localStorage.setItem("gangnam_book_api_key", urlKey.trim());
          setApiKey(urlKey.trim());
          window.history.replaceState({}, document.title, window.location.pathname);
        } else {
          const storedKey = localStorage.getItem("gangnam_book_api_key");
          if (storedKey) setApiKey(storedKey.trim());
        }
        return () => stopBarcodeScanner();
      }, []);

      const saveManualKey = () => {
        if (!tempKey.trim()) return;
        localStorage.setItem("gangnam_book_api_key", tempKey.trim());
        setApiKey(tempKey.trim());
        setShowKeyInput(false);
        setError("");
        alert("API 키가 저장되었습니다.");
      };

      const toggleLibrary = (lib) => {
        if (selectedLibs.includes(lib)) setSelectedLibs(selectedLibs.filter((i) => i !== lib));
        else setSelectedLibs([...selectedLibs, lib]);
      };

      const selectAll = () => setSelectedLibs([...GANGNAM_LIBRARIES]);
      const deselectAll = () => setSelectedLibs([]);

      // 1. 책 표지 AI 검색 (CORS 에러 방지를 위해 key를 주소창에 포함)
      const handleCoverUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const currentKey = apiKey || localStorage.getItem("gangnam_book_api_key");
        if (!currentKey) {
          setError("상단 ⚙️ 키 등록 버튼을 눌러 API 키를 입력해주세요.");
          setShowKeyInput(true);
          return;
        }

        setError("");
        setImagePreview(URL.createObjectURL(file));
        setIsAnalyzing(true);
        setStatusMessage("사진 최적화 중...");

        // 무한 로딩 방지용 8초 타임아웃
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        try {
          const base64Data = await resizeImage(file);
          setStatusMessage("AI 표지 분석 중...");

          // URL 파라미터로 키 전송 (CORS 차단 방지)
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`;
          
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: "이 이미지의 책 표지에서 책 제목만 추출해줘. 부연설명 없이 오직 제목만 한 줄로 반환해." },
                  { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                ]
              }]
            }),
            signal: controller.signal
          });

          clearTimeout(timeoutId);
          const result = await response.json();

          if (!response.ok) throw new Error(result.error?.message || "서버 응답 오류");

          if (result.candidates && result.candidates[0]?.content?.parts[0]?.text) {
            const detectedTitle = result.candidates[0].content.parts[0].text.trim().replace(/[\"\'\n\r]/g, "");
            setSearchQuery(detectedTitle);
            setStatusMessage("제목 인식 완료!");
          } else {
            throw new Error("사진에서 책 제목을 찾지 못했습니다.");
          }
        } catch (err) {
          clearTimeout(timeoutId);
          if (err.name === "AbortError") {
            setError("인터넷 연결이 불안정하거나 서버가 응답하지 않습니다.");
          } else {
            setError(`분석 실패: ${err.message}`);
          }
        } finally {
          setIsAnalyzing(false);
          setStatusMessage("");
        }
      };

      // 2. 바코드 ISBN 전용 스캐너
      const handleBarcodeDetected = async (code) => {
        stopBarcodeScanner();
        setError("");
        setStatusMessage(`바코드 확인: ${code}`);
        if (navigator.vibrate) navigator.vibrate(100);

        try {
          const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${code}`);
          const data = await res.json();
          if (data.items && data.items[0]?.volumeInfo?.title) {
            setSearchQuery(data.items[0].volumeInfo.title);
            setStatusMessage(`책 찾기 성공!`);
          } else {
            setSearchQuery(code);
            setStatusMessage("ISBN 번호로 검색합니다.");
          }
        } catch (e) {
          setSearchQuery(code);
        }
      };

      const startBarcodeScanner = async () => {
        setError("");
        setIsScanningBarcode(true);

        try {
          if (!qrScannerRef.current) {
            qrScannerRef.current = new Html5Qrcode("barcode-reader");
          }
          
          // EAN-13 (책 바코드) 규격만 집중적으로 찾도록 설정 및 가로로 넓은 가이드라인 적용
          await qrScannerRef.current.start(
            { facingMode: "environment" },
            { 
              fps: 10,
              qrbox: { width: 300, height: 120 },
              formatsToSupport: [ Html5QrcodeSupportedFormats.EAN_13 ] 
            },
            (decodedText) => handleBarcodeDetected(decodedText),
            (err) => {} // 무시 (인식 중 실패 프레임)
          );
        } catch (err) {
          setError("카메라 접근 권한을 허용해주세요. (브라우저 설정 확인)");
          setIsScanningBarcode(false);
        }
      };

      const stopBarcodeScanner = async () => {
        if (qrScannerRef.current && isScanningBarcode) {
          try {
            await qrScannerRef.current.stop();
            qrScannerRef.current.clear();
          } catch(e) {}
        }
        setIsScanningBarcode(false);
