<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강남구 도서관 책 찾기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const GANGNAM_LIBRARIES = [
      "행복한도서관", "강남구립국제영어도서관", "개포하늘꿈도서관", "논현북푸른도서관",
      "대치복합문화도서관", "도곡정보문화도서관", "못골열린도서관", "못골한옥어린이도서관",
      "밀리아재미도서관", "세곡비단길도서관", "수서명화어린이도서관", "아곡어린이도서관",
      "압구정새싹작은도서관", "역삼도서관", "역삼푸른솔도서관", "일곡어린이도서관", "청담도서관"
    ];

    // 구글 큐 통과를 위해 500px, 20KB 수준으로 초경량 압축
    const resizeImage = (file) => {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(img.src);
          const maxDim = 500;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL("image/jpeg", 0.5).split(",")[1]);
        };
        img.onerror = () => reject(new Error("사진 압축 실패"));
      });
    };

    function App() {
      const [apiKey, setApiKey] = useState("");
      const [showKeyInput, setShowKeyInput] = useState(false);
      const [tempKey, setTempKey] = useState("");
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedLibs, setSelectedLibs] = useState(GANGNAM_LIBRARIES);
      
      const [scanMode, setScanMode] = useState("barcode"); // 대기열 없는 바코드를 기본값으로 배치
      const [imagePreview, setImagePreview] = useState(null);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [statusMessage, setStatusMessage] = useState("");
      
      const [isCameraActive, setIsCameraActive] = useState(false);
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const scanIntervalRef = useRef(null);

      const [error, setError] = useState("");
      const fileInputRef = useRef(null);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlKey = params.get("key");

        if (urlKey) {
          localStorage.setItem("gangnam_book_api_key", urlKey.trim());
          setApiKey(urlKey.trim());
          window.history.replaceState({}, document.title, window.location.pathname);
        } else {
          const storedKey = localStorage.getItem("gangnam_book_api_key");
          if (storedKey) setApiKey(storedKey.trim());
        }

        return () => stopCamera();
      }, []);

      const saveManualKey = () => {
        if (!tempKey.trim()) return;
        localStorage.setItem("gangnam_book_api_key", tempKey.trim());
        setApiKey(tempKey.trim());
        setShowKeyInput(false);
        setError("");
        alert("API 키가 저장되었습니다.");
      };

      const toggleLibrary = (lib) => {
        if (selectedLibs.includes(lib)) setSelectedLibs(selectedLibs.filter((i) => i !== lib));
        else setSelectedLibs([...selectedLibs, lib]);
      };

      const selectAll = () => setSelectedLibs([...GANGNAM_LIBRARIES]);
      const deselectAll = () => setSelectedLibs([]);

      // 1. 네이티브 바코드 스캔 로직 (구글 AI 미경유, 0.05초 즉각 판독)
      const handleBarcodeDetected = async (code) => {
        stopCamera();
        setError("");
        setStatusMessage(`바코드 감지: ${code}`);

        if (navigator.vibrate) navigator.vibrate(100);

        try {
          const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${code}`);
          const data = await res.json();
          if (data.items && data.items[0]?.volumeInfo?.title) {
            setSearchQuery(data.items[0].volumeInfo.title);
            setStatusMessage(`책 제목 확인 완료!`);
          } else {
            setSearchQuery(code);
            setStatusMessage("ISBN 번호로 검색합니다.");
          }
        } catch (e) {
          setSearchQuery(code);
          setStatusMessage("ISBN 번호로 검색합니다.");
        }
      };

      // 브라우저 하드웨어 가속 바코드 감지기 구동
      const startCamera = async () => {
        setError("");
        setStatusMessage("카메라 구동 중...");

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
          });
          streamRef.current = stream;
          setIsCameraActive(true);

          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            await videoRef.current.play();
          }

          // 안드로이드 내장 바코드 스캐너 엔진 구동
          if ("BarcodeDetector" in window) {
            const detector = new window.BarcodeDetector({ formats: ["ean_13", "qr_code"] });
            scanIntervalRef.current = setInterval(async () => {
              if (videoRef.current && videoRef.current.readyState === 4) {
                try {
                  const barcodes = await detector.detect(videoRef.current);
                  if (barcodes.length > 0) {
                    clearInterval(scanIntervalRef.current);
                    handleBarcodeDetected(barcodes[0].rawValue);
                  }
                } catch (e) {}
              }
            }, 100);
          } else {
            // 폴백: html5-qrcode
            const html5QrCode = new Html5Qrcode("barcode-fallback-canvas");
            html5QrCode.start(
              { facingMode: "environment" },
              { fps: 10, qrbox: { width: 280, height: 120 } },
              (decodedText) => {
                html5QrCode.stop();
                handleBarcodeDetected(decodedText);
              },
              () => {}
            );
          }
          setStatusMessage("바코드를 사각형 안에 비춰주세요");
        } catch (err) {
          setIsCameraActive(false);
          setError("카메라 권한을 켤 수 없습니다. 브라우저 주소창 왼쪽의 권한 설정을 확인해주세요.");
        }
      };

      const stopCamera = () => {
        if (scanIntervalRef.current) clearInterval(scanIntervalRef.current);
        if (streamRef.current) {
          streamRef.current.getTracks().forEach((track) => track.stop());
          streamRef.current = null;
        }
        setIsCameraActive(false);
      };

      // 2. 표지 사진 AI 분석 (초경량 20KB 전송)
      const handleCoverUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const currentKey = apiKey || localStorage.getItem("gangnam_book_api_key");
        if (!currentKey) {
          setError("상단 ⚙️ 키 등록 버튼을 눌러 API 키를 입력해주세요.");
          setShowKeyInput(true);
          return;
        }

        setError("");
        setImagePreview(URL.createObjectURL(file));
        setIsAnalyzing(true);
        setStatusMessage("사진 초경량 압축 중...");

        let sec = 0;
        const timer = setInterval(() => {
          sec++;
          setStatusMessage(`구글 AI 분석 대기 중... (${sec}초)`);
        }, 1000);

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 45000); // 45초 타임아웃

        try {
          const base64Data = await resizeImage(file);

          const response = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": currentKey
              },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      { text: "이 책 표지에서 오직 책 제목만 추출해줘. 부연설명 없이 오직 제목만 한 줄로 반환해." },
                      {
                        inline_data: {
                          mime_type: "image/jpeg",
                          data: base64Data
                        }
                      }
                    ]
                  }
                ],
                generationConfig: { maxOutputTokens: 30, temperature: 0.1 }
              }),
              signal: controller.signal
            }
          );

          clearInterval(timer);
          clearTimeout(timeoutId);

          const result = await response.json();

          if (!response.ok) throw new Error(result.error?.message || `구글 서버 오류 (${response.status})`);

          if (result.candidates && result.candidates[0]?.content?.parts[0]?.text) {
            const detectedTitle = result.candidates[0].content.parts[0].text.trim().replace(/[\"\'\n\r]/g, "");
            setSearchQuery(detectedTitle);
            setStatusMessage("제목 인식 완료!");
          } else {
            throw new Error("사진에서 책 제목을 인식하지 못했습니다.");
          }
        } catch (err) {
          clearInterval(timer);
          clearTimeout(timeoutId);
          if (err.name === "AbortError") {
            setError("구글 무료 서버의 대기열이 너무 길어 응답이 지연되었습니다. '바코드 스캔'을 이용하시면 0.1초 만에 바로 확인 가능합니다.");
          } else {
            setError(`분석 실패: ${err.message}`);
          }
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleLibrarySearch = () => {
        if (!searchQuery.trim()) {
          setError("검색할 책 제목 또는 바코드를 입력해주세요.");
          return;
        }
        setError("");
        const encoded = encodeURIComponent(searchQuery.trim());
        const targetUrl = `https://library.gangnam.go.kr/happylib/plusSearchResultList.do?searchKeyword=${encoded}`;
        window.open(targetUrl, "_blank");
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-white shadow-md flex flex-col font-sans">
          <header className="bg-teal-600 text-white p-5 sticky top-0 z-10 shadow flex justify-between items-start">
            <div>
              <h1 className="text-xl font-bold flex items-center gap-2">
                <span>📚</span> 강남구 도서관 책 찾기
              </h1>
              <p className="text-teal-100 text-xs mt-1">바코드 또는 표지 촬영으로 도서를 검색합니다</p>
            </div>
            <button 
              onClick={() => setShowKeyInput(!showKeyInput)}
              className="text-white text-xs bg-teal-700 hover:bg-teal-800 px-2.5 py-1.5 rounded-lg transition"
            >
              ⚙️ {apiKey ? "키 변경" : "키 등록"}
            </button>
          </header>

          <main className="p-4 flex-1 space-y-4">
            {showKeyInput && (
              <div className="bg-teal-50 border border-teal-200 rounded-xl p-3 text-xs space-y-2">
                <p className="font-semibold text-teal-900">🔑 Gemini API 키 입력</p>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={tempKey}
                    onChange={(e) => setTempKey(e.target.value)}
                    placeholder="AQ.Ab... 로 시작하는 키 붙여넣기"
                    className="flex-1 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs bg-white"
                  />
                  <button
                    onClick={saveManualKey}
                    className="bg-teal-600 text-white font-medium px-3 py-1.5 rounded-lg text-xs"
                  >
                    저장
                  </button>
                </div>
              </div>
            )}

            {/* 상단 모드 전환 탭 */}
            <div className="flex rounded-xl bg-slate-100 p-1 text-xs font-semibold">
              <button
                onClick={() => { stopCamera(); setScanMode("barcode"); }}
                className={`flex-1 py-2.5 text-center rounded-lg transition ${
                  scanMode === "barcode" ? "bg-white text-teal-700 shadow-sm" : "text-slate-500"
                }`}
              >
                📟 바코드 스캔 (추천·서버 무관)
              </button>
              <button
                onClick={() => { stopCamera(); setScanMode("cover"); }}
                className={`flex-1 py-2.5 text-center rounded-lg transition ${
                  scanMode === "cover" ? "bg-white text-teal-700 shadow-sm" : "text-slate-500"
                }`}
              >
                📸 책 표지 사진 (AI 분석)
              </button>
            </div>

            {/* 1. 바코드 스캐너 영역 */}
            {scanMode === "barcode" && (
              <div className="bg-teal-50 border-2 border-dashed border-teal-300 rounded-2xl p-4 text-center space-y-3">
                <div id="barcode-fallback-canvas" className="hidden"></div>

                {isCameraActive ? (
                  <div className="space-y-3">
                    <div className="relative w-full h-56 bg-black rounded-xl overflow-hidden flex items-center justify-center">
                      <video ref={videoRef} playsInline muted className="w-full h-full object-cover"></video>
                      <div className="absolute border-2 border-teal-400 rounded-lg w-64 h-24 pointer-events-none opacity-80 animate-pulse"></div>
                    </div>
                    <button
                      onClick={stopCamera}
                      className="bg-slate-600 text-white text-xs px-4 py-2 rounded-xl"
                    >
                      카메라 끄기
                    </button>
                  </div>
                ) : (
                  <div className="py-2 space-y-3">
                    <div className="text-4xl">📟</div>
                    <div>
                      <p className="text-sm font-semibold text-teal-900">책 뒷면 바코드 스캔</p>
                      <p className="text-xs text-teal-600 mt-1">구글 서버 대기열 없이 기기에서 즉시 읽어냅니다</p>
                    </div>

                    <button
                      onClick={startCamera}
                      className="bg-teal-600 hover:bg-teal-700 text-white font-medium px-5 py-2.5 rounded-xl text-xs shadow transition"
                    >
                      📷 실시간 카메라 켜기
                    </button>
                  </div>
                )}

                {statusMessage && <p className="text-xs text-teal-800 font-medium">{statusMessage}</p>}
              </div>
            )}

            {/* 2. 표지 사진 AI 영역 */}
            {scanMode === "cover" && (
              <div className="bg-teal-50 border-2 border-dashed border-teal-300 rounded-2xl p-4 text-center">
                <input 
                  type="file" 
                  accept="image/*" 
                  capture="environment" 
                  ref={fileInputRef} 
                  onChange={handleCoverUpload} 
                  className="hidden" 
                />
                
                {imagePreview ? (
                  <div className="space-y-3">
                    <img src={imagePreview} alt="선택한 책" className="h-40 mx-auto rounded-lg object-contain shadow" />
                    <button 
                      onClick={() => fileInputRef.current?.click()} 
                      className="text-xs text-teal-700 underline font-medium"
                      disabled={isAnalyzing}
                    >
                      다른 사진 찍기
                    </button>
                  </div>
                ) : (
                  <div onClick={() => fileInputRef.current?.click()} className="cursor-pointer py-4">
                    <div className="text-4xl mb-2">📸</div>
                    <p className="text-sm font-semibold text-teal-900">책 표지 촬영</p>
                    <p className="text-xs text-teal-600 mt-1">AI가 표지에서 제목을 추출합니다</p>
                  </div>
                )}

                {isAnalyzing && (
                  <div className="mt-3 flex items-center justify-center gap-2 text-teal-800 text-sm font-medium">
                    <div className="w-4 h-4 border-2 border-teal-600 border-t-transparent rounded-full animate-spin"></div>
                    {statusMessage}
                  </div>
                )}
              </div>
            )}

            {/* 도서명 입력창 */}
            <div>
              <label className="block text-xs font-semibold text-slate-600 mb-1">검색할 도서명 (또는 바코드 번호)</label>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="예: 어린왕자 또는 97889..."
                  className="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                />
                <button
                  onClick={handleLibrarySearch}
                  className="bg-teal-600 hover:bg-teal-700 text-white font-semibold px-4 py-2 rounded-xl text-sm transition shadow shrink-0"
                >
                  검색하기
                </button>
              </div>
            </div>

            {error && (
              <div className="bg-red-50 border border-red-200 text-red-600 text-xs p-3 rounded-xl flex items-center gap-2">
                <span>⚠️</span> {error}
              </div>
            )}

            {/* 도서관 목록 필터 */}
            <div className="border-t border-slate-100 pt-3">
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-bold text-slate-700">도서관 필터 ({selectedLibs.length}곳)</span>
                <div className="text-xs space-x-2">
                  <button onClick={selectAll} className="text-teal-600 hover:underline">전체 선택</button>
                  <span className="text-slate-300">|</span>
                  <button onClick={deselectAll} className="text-slate-400 hover:underline">선택 해제</button>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-1.5 max-h-52 overflow-y-auto p-1 bg-slate-50 rounded-xl border border-slate-200">
                {GANGNAM_LIBRARIES.map((lib) => {
                  const isChecked = selectedLibs.includes(lib);
                  return (
                    <label 
                      key={lib} 
                      onClick={() => toggleLibrary(lib)}
                      className={`flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs cursor-pointer border transition ${
                        isChecked 
                          ? "bg-teal-50 border-teal-200 text-teal-900 font-medium" 
                          : "bg-white border-slate-200 text-slate-400"
                      }`}
                    >
                      <input 
                        type="checkbox" 
                        checked={isChecked} 
                        readOnly
                        className="rounded text-teal-600 focus:ring-teal-500 h-3.5 w-3.5" 
                      />
                      <span className="truncate">{lib}</span>
                    </label>
                  );
                })}
              </div>
            </div>

            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 space-y-1">
              <p className="font-semibold">💡 이용 안내</p>
              <p>[검색하기]를 누르면 강남구립도서관 공식 페이지가 열려 실시간 대출·예약 상태가 표시됩니다.</p>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
